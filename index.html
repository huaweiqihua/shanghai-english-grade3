<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>沪版英语3-4年级</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            height: 100%; 
            overflow: hidden;
            touch-action: pan-y;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 模式选择 */
        .mode-select {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .mode-select h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 40px;
            text-align: center;
        }
        .mode-btn {
            width: 200px;
            padding: 25px;
            margin: 15px;
            font-size: 22px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .mode-btn:active { transform: scale(0.95); }
        .mode-btn.memory {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
        }
        .mode-btn.test {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            box-shadow: 0 8px 25px rgba(76,175,80,0.4);
        }
        
        /* 记忆模式 - 卡片 */
        .memory-mode {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .memory-mode.active { display: flex; }
        
        .card-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            position: absolute;
            width: 90%;
            max-width: 350px;
            height: 70%;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            transition: transform 0.3s, opacity 0.3s;
            cursor: grab;
        }
        .card.swiping { transition: none; }
        .card-image {
            font-size: 100px;
            margin-bottom: 20px;
        }
        .card-word {
            font-size: 36px;
            color: #1e3c72;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card-phonetic {
            font-size: 18px;
            color: #888;
            margin-bottom: 15px;
            font-family: 'Lucida Sans', sans-serif;
        }
        .card-chinese {
            font-size: 22px;
            color: #333;
        }
        .card-audio {
            margin-top: 20px;
            padding: 12px 30px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-nav {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
        }
        .card-nav span { opacity: 0.8; }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* 测试模式 */
        .test-mode {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 20px;
        }
        .test-mode.active { display: flex; }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .test-header .back-btn {
            position: static;
        }
        .test-progress {
            color: white;
            font-size: 16px;
        }
        
        .test-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .test-question {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .test-hint {
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            margin-bottom: 40px;
        }
        .test-input-container {
            width: 100%;
            max-width: 400px;
        }
        .test-input {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            border: 3px solid white;
            border-radius: 15px;
            background: rgba(255,255,255,0.9);
            outline: none;
            text-align: center;
        }
        .test-input:focus { border-color: #ffd700; }
        .test-input.correct { border-color: #4caf50; background: #e8f5e9; }
        .test-input.wrong { border-color: #f44336; background: #ffebee; }
        
        .test-btns {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .test-btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .test-btn.submit { background: #4caf50; color: white; }
        .test-btn.skip { background: #999; color: white; }
        
        .test-feedback {
            margin-top: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            display: none;
        }
        .test-feedback.show { display: block; }
        .test-feedback.correct { background: #4caf50; color: white; }
        .test-feedback.wrong { background: #f44336; color: white; }
        
        /* 结果页面 */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }
        .result-screen.active { display: flex; }
        .result-score {
            font-size: 80px;
            color: white;
            font-weight: bold;
        }
        .result-message {
            font-size: 24px;
            color: rgba(255,255,255,0.9);
            margin: 20px 0;
        }
        .result-btns {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .result-btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .result-btn.primary { background: white; color: #1e3c72; }
        .result-btn.secondary { background: rgba(255,255,255,0.3); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 模式选择 -->
        <div class="mode-select" id="modeSelect">
            <h1>📚 沪版英语<br>3-4年级</h1>
            <button class="mode-btn memory" onclick="startMemoryMode()">
                🧠 记忆模式
            </button>
            <button class="mode-btn test" onclick="startTestMode()">
                ✍️ 测试模式
            </button>
        </div>
        
        <!-- 记忆模式 -->
        <div class="memory-mode" id="memoryMode">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="card-container" id="cardContainer">
                <div class="card" id="flashcard">
                    <div class="card-image" id="cardImage">🐕</div>
                    <div class="card-word" id="cardWord">dog</div>
                    <div class="card-phonetic" id="cardPhonetic">[dɒɡ]</div>
                    <div class="card-chinese" id="cardChinese">狗</div>
                    <button class="card-audio" onclick="speakWord(event)">
                        🔊 朗读
                    </button>
                </div>
            </div>
            <div class="card-nav">
                <span>← 左滑复习</span>
                <span id="cardIndex">1 / 10</span>
                <span>右滑下一个 →</span>
            </div>
        </div>
        
        <!-- 测试模式 -->
        <div class="test-mode" id="testMode">
            <div class="test-header">
                <button class="back-btn" onclick="goBack()">← 返回</button>
                <span class="test-progress" id="testProgress">1 / 10</span>
            </div>
            <div class="test-content">
                <div class="test-question" id="testQuestion">狗</div>
                <div class="test-hint" id="testHint">请拼写英文</div>
                <div class="test-input-container">
                    <input type="text" class="test-input" id="testInput" 
                           placeholder="请输入英文..." 
                           autocomplete="off" 
                           autocapitalize="off" 
                           spellcheck="false">
                </div>
                <div class="test-btns">
                    <button class="test-btn submit" onclick="submitAnswer()">提交</button>
                    <button class="test-btn skip" onclick="skipTest()">跳过</button>
                </div>
                <div class="test-feedback" id="testFeedback"></div>
            </div>
        </div>
        
        <!-- 结果页面 -->
        <div class="result-screen" id="resultScreen">
            <div class="result-score" id="resultScore">8/10</div>
            <div class="result-message" id="resultMessage">很棒！继续努力！</div>
            <div class="result-btns">
                <button class="result-btn primary" onclick="restartTest()">再测一次</button>
                <button class="result-btn secondary" onclick="goBack()">返回首页</button>
            </div>
        </div>
    </div>

        // 随机打乱数组
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 返回首页
        function goBack() {
            document.getElementById('modeSelect').style.display = 'flex';
            document.getElementById('memoryMode').classList.remove('active');
            document.getElementById('testMode').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
        }

        // ==================== 记忆模式 ====================
        function startMemoryMode() {
            document.getElementById('modeSelect').style.display = 'none';
            document.getElementById('memoryMode').classList.add('active');

            cardIndex = 0;
            showCard();
            initSwipe();
        }

        function showCard() {
            const vocab = currentVocab[cardIndex];
            document.getElementById('cardImage').textContent = vocab.emoji;
            document.getElementById('cardWord').textContent = vocab.word;
            document.getElementById('cardPhonetic').textContent = vocab.phonetic;
            document.getElementById('cardChinese').textContent = vocab.chinese;
            document.getElementById('cardIndex').textContent = `${cardIndex + 1} / ${currentVocab.length}`;
        }

        function speakWord(e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            const vocab = currentVocab[cardIndex];
            const utterance = new SpeechSynthesisUtterance(vocab.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }

        function initSwipe() {
            const container = document.getElementById('cardContainer');
            const card = document.getElementById('flashcard');
            
            container.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isDragging = true;
                card.classList.add('swiping');
            });
            
            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentX = e.touches[0].clientX;
                const diff = currentX - startX;
                card.style.transform = `translateX(${diff}px) rotate(${diff * 0.05}deg)`;
            });
            
            container.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                card.classList.remove('swiping');
                
                const diff = currentX - startX;
                
                if (diff < -80) {
                    // 左滑 - 下一个（用户要求）
                    card.style.transition = 'transform 0.3s';
                    card.style.transform = 'translateX(-100%) rotate(-20deg)';
                    setTimeout(() => {
                        cardIndex = Math.min(currentVocab.length - 1, cardIndex + 1);
                        card.style.transition = 'none';
                        card.style.transform = '';
                        showCard();
                    }, 200);
                } else if (diff > 80) {
                    // 右滑 - 复习/上一个（用户要求）
                    card.style.transition = 'transform 0.3s';
                    card.style.transform = 'translateX(100%) rotate(20deg)';
                    setTimeout(() => {
                        cardIndex = Math.max(0, cardIndex - 1);
                        card.style.transition = 'none';
                        card.style.transform = '';
                        showCard();
                    }, 200);
                } else {
                    card.style.transition = 'transform 0.3s';
                    card.style.transform = '';
                }
                currentX = 0;
                startX = 0;
            });
        }

        // ==================== 测试模式 ====================
        function startTestMode() {
            document.getElementById('modeSelect').style.display = 'none';
            document.getElementById('testMode').classList.add('active');
            
            currentVocab = shuffle([...vocabList]).slice(0, 10);
            testIndex = 0;
            testScore = 0;
            testAnswers = [];
            
            showTestQuestion();
        }

        function showTestQuestion() {
            const vocab = currentVocab[testIndex];
            document.getElementById('testProgress').textContent = `${testIndex + 1} / ${currentVocab.length}`;
            document.getElementById('testQuestion').textContent = vocab.chinese;
            document.getElementById('testHint').textContent = '请拼写英文';
            
            const input = document.getElementById('testInput');
            input.value = '';
            input.className = 'test-input';
            input.focus();
            
            document.getElementById('testFeedback').className = 'test-feedback';
        }

        function submitAnswer() {
            const input = document.getElementById('testInput');
            const userAnswer = input.value.trim().toLowerCase();
            const vocab = currentVocab[testIndex];
            const correctAnswer = vocab.word.toLowerCase();
            
            const isCorrect = userAnswer === correctAnswer;
            
            if (isCorrect) {
                testScore++;
                input.classList.add('correct');
                document.getElementById('testFeedback').className = 'test-feedback show correct';
                document.getElementById('testFeedback').textContent = '✅ 正确！';
            } else {
                input.classList.add('wrong');
                document.getElementById('testFeedback').className = 'test-feedback show wrong';
                document.getElementById('testFeedback').textContent = `❌ 正确: ${vocab.word}`;
            }
            
            testAnswers.push({
                chinese: vocab.chinese,
                userAnswer: userAnswer || '(跳过)',
                correctAnswer: vocab.word,
                isCorrect: isCorrect
            });
            
            setTimeout(() => {
                nextQuestion();
            }, 1500);
        }

        function skipTest() {
            const vocab = currentVocab[testIndex];
            testAnswers.push({
                chinese: vocab.chinese,
                userAnswer: '(跳过)',
                correctAnswer: vocab.word,
                isCorrect: false
            });
            nextQuestion();
        }

        function nextQuestion() {
            testIndex++;
            if (testIndex < currentVocab.length) {
                showTestQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('testMode').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');
            
            document.getElementById('resultScore').textContent = `${testScore}/${currentVocab.length}`;
            
            const percentage = (testScore / currentVocab.length) * 100;
            let message = '';
            if (percentage === 100) message = '🎉 太棒了！满分！';
            else if (percentage >= 80) message = '🌟 非常优秀！';
            else if (percentage >= 60) message = '👍 做得不错！';
            else if (percentage >= 40) message = '📚 再加油！';
            else message = '💪 继续努力！';
            
            document.getElementById('resultMessage').textContent = message;
        }

        function restartTest() {
            document.getElementById('resultScreen').classList.remove('active');
            startTestMode();
        }

        // 回车提交
        document.getElementById('testInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        });
    </script>
</body>
</html>
