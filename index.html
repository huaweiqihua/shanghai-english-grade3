<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海小学3-4年级英语测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .grade-tag {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .start-screen, .quiz-screen, .result-screen { display: none; }
        .active { display: block; }
        .btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: #666;
            margin-top: 10px;
        }
        .progress {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .progress-item {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: #ddd;
            color: #888;
        }
        .progress-item.done { background: #4caf50; color: white; }
        .progress-item.current { background: #1e3c72; color: white; }
        .question {
            font-size: 20px;
            text-align: center;
            margin: 20px 0;
            color: #333;
            line-height: 1.6;
        }
        .question-image { font-size: 70px; text-align: center; margin: 15px 0; }
        .hint {
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .answer-input {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px 20px;
            font-size: 22px;
            border: 3px solid #1e3c72;
            border-radius: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        .answer-input:focus { border-color: #ff6b6b; }
        .answer-input.correct { border-color: #4caf50; background: #e8f5e9; }
        .answer-input.wrong { border-color: #f44336; background: #ffebee; }
        .submit-btn {
            display: block;
            width: 150px;
            margin: 10px auto;
            padding: 12px 25px;
            font-size: 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .skip-btn {
            display: block;
            width: 150px;
            margin: 10px auto;
            padding: 12px 25px;
            font-size: 16px;
            background: #999;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .feedback {
            text-align: center;
            font-size: 18px;
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #e8f5e9; color: #2e7d32; }
        .feedback.wrong { background: #ffebee; color: #c62828; }
        .score-display { text-align: center; font-size: 60px; color: #1e3c72; margin: 20px 0; }
        .score-message { text-align: center; font-size: 22px; color: #666; margin-bottom: 20px; }
        .result-details { background: #f5f5f5; padding: 20px; border-radius: 15px; margin: 20px 0; max-height: 300px; overflow-y: auto; }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .correct-answer { color: #4caf50; font-weight: bold; }
        .result-item .your-answer { color: #f44336; }
        .info-box {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .info-box h3 { color: #1e3c72; margin-bottom: 10px; font-size: 16px; }
        .info-box ul { padding-left: 20px; color: #555; font-size: 14px; }
        .info-box li { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📚 上海小学3-4年级英语测试</h1>
            <p class="subtitle">沪版英语教材 · 拼写模式</p>
            <div style="text-align: center;">
                <span class="grade-tag">三年级 · 四年级</span>
            </div>
            
            <div class="start-screen active" id="startScreen">
                <div class="info-box">
                    <h3>📖 测试说明</h3>
                    <ul>
                        <li>基于沪版英语3-4年级教材词汇</li>
                        <li><strong>拼写模式</strong>：请根据中文提示拼写英文单词</li>
                        <li>大小写均可，正确拼写即得分</li>
                        <li>每次10题，共30题题库随机抽取</li>
                    </ul>
                </div>
                <button class="btn" onclick="startQuiz()">开始测试 ✍️</button>
            </div>
            
            <div class="quiz-screen" id="quizScreen">
                <div class="progress" id="progress"></div>
                <div class="question" id="question"></div>
                <div class="question-image" id="questionImage"></div>
                <div class="hint" id="hint"></div>
                <input type="text" class="answer-input" id="answerInput" placeholder="请拼写英文..." autocomplete="off">
                <button class="submit-btn" onclick="checkAnswer()">提交 ✓</button>
                <button class="skip-btn" onclick="skipAnswer()">跳过 →</button>
                <div class="feedback" id="feedback"></div>
            </div>
            
            <div class="result-screen" id="resultScreen">
                <div class="score-display" id="scoreDisplay"></div>
                <div class="score-message" id="scoreMessage"></div>
                <div class="result-details" id="resultDetails"></div>
                <button class="btn" onclick="restartQuiz()">再测一次 🔄</button>
            </div>
        </div>
    </div>

    <script>

        const questions = [

            { unit: "U1", question: "你好", answer: "hello", hint: "问候语" },

            { unit: "U5", question: "棕色", answer: "brown", hint: "颜色" },
            { unit: "U5", question: "黑色", answer: "black", hint: "颜色" },
            { unit: "U5", question: "白色", answer: "white", hint: "颜色" },
            
            // Unit 6: 动物 (Animals)
            { unit: "U6", question: "狗", answer: "dog", hint: "动物" },
            { unit: "U6", question: "猫", answer: "cat", hint: "动物" },
            { unit: "U6", question: "鸟", answer: "bird", hint: "动物" },

            { unit: "U6", question: "熊猫", answer: "panda", hint: "动物" },
            { unit: "U6", question: "老虎", answer: "tiger", hint: "动物" },
            { unit: "U6", question: "狮子", answer: "lion", hint: "动物" },
            
            // Unit 7: 食物 (Food)
            { unit: "U7", question: "苹果", answer: "apple", hint: "食物" },
            { unit: "U7", question: "香蕉", answer: "banana", hint: "食物" },

            { unit: "U8", question: "学校", answer: "school", hint: "学校" },

            { unit: "U8", question: "书", answer: "book", hint: "文具" },
            { unit: "U8", question: "铅笔", answer: "pencil", hint: "文具" },

            { unit: "U9", question: "头", answer: "head", hint: "身体" },

            { unit: "U9", question: "眼睛", answer: "eye", hint: "身体" },
            { unit: "U9", question: "鼻子", answer: "nose", hint: "身体" },
            { unit: "U9", question: "嘴巴", answer: "mouth", hint: "身体" },
            { unit: "U9", question: "耳朵", answer: "ear", hint: "身体" },
            { unit: "U9", question: "手", answer: "hand", hint: "身体" },
            { unit: "U9", question: "脚", answer: "foot", hint: "身体" },
            
            // Unit 10: 星期 (Week)
            { unit: "U10", question: "星期一", answer: "monday", hint: "星期" },
            { unit: "U10", question: "星期二", answer: "tuesday", hint: "星期" },
            { unit: "U10", question: "星期三", answer: "wednesday", hint: "星期" },
            { unit: "U10", question: "星期四", answer: "thursday", hint: "星期" },
            { unit: "U10", question: "星期五", answer: "friday", hint: "星期" },
            { unit: "U10", question: "星期六", answer: "saturday", hint: "星期" },
            { unit: "U10", question: "星期日/天", answer: "sunday", hint: "星期" },
            { unit: "U10", question: "周/星期", answer: "week", hint: "时间" },
            
            // Unit 11: 科目 (Subjects)
            { unit: "U11", question: "英语", answer: "english", hint: "科目" },
            { unit: "U11", question: "数学", answer: "maths", hint: "科目" },
            { unit: "U11", question: "语文", answer: "chinese", hint: "科目" },
            { unit: "U11", question: "音乐", answer: "music", hint: "科目" },
            { unit: "U11", question: "美术", answer: "art", hint: "科目" },
            { unit: "U11", question: "体育", answer: "pe", hint: "科目" },
            
            // Unit 12: 活动 (Activities)
            { unit: "U12", question: "阅读", answer: "read", hint: "动词" },
            { unit: "U12", question: "书写", answer: "write", hint: "动词" },
            { unit: "U12", question: "画画", answer: "draw", hint: "动词" },
            { unit: "U12", question: "唱歌", answer: "sing", hint: "动词" },
            { unit: "U12", question: "跳舞", answer: "dance", hint: "动词" },
            { unit: "U12", question: "游戏", answer: "play", hint: "动词" },
            { unit: "U12", question: "听", answer: "listen", hint: "动词" },
            { unit: "U12", question: "说", answer: "speak", hint: "动词" },
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            currentQuestions = shuffleArray([...questions]).slice(0, 10);
            currentIndex = 0;
            score = 0;
            userAnswers = [];
            
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            document.getElementById('resultScreen').classList.remove('active');
            
            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[currentIndex];
            
            // 更新进度
            let progressHTML = '';
            for (let i = 0; i < currentQuestions.length; i++) {
                if (i < currentIndex) {
                    progressHTML += `<div class="progress-item done">✓</div>`;
                } else if (i === currentIndex) {
                    progressHTML += `<div class="progress-item current">${i + 1}</div>`;
                } else {
                    progressHTML += `<div class="progress-item">${i + 1}</div>`;
                }
            }
            document.getElementById('progress').innerHTML = progressHTML;
            
            // 显示题目
            document.getElementById('question').textContent = `(${q.unit}) ${q.question}`;
            document.getElementById('questionImage').textContent = getEmoji(q.question);
            document.getElementById('hint').textContent = `提示: ${q.hint}`;
            
            // 重置输入框
            const input = document.getElementById('answerInput');
            input.value = '';
            input.className = 'answer-input';
            input.focus();
            
            document.getElementById('feedback').className = 'feedback';
        }

        function getEmoji(word) {
            const emojiMap = {
                '你好': '👋', '早上好': '🌅', '下午好': '🌤️', '再见': '👋', '谢谢你': '🙏', '对不起': '😢',
                '我': '👤', '你': '👤', '他': '👨', '她': '👩', '它': '🐱',
                '父亲/爸爸': '👨', '母亲/妈妈': '👩', '兄弟/哥哥': '👦', '姐妹/姐姐': '👧', '祖父/爷爷': '👴', '祖母/奶奶': '👵',
                '一': '1️⃣', '二': '2️⃣', '三': '3️⃣', '四': '4️⃣', '五': '5️⃣', '六': '6️⃣', '七': '7️⃣', '八': '8️⃣', '九': '9️⃣', '十': '🔟',
                '红色': '🔴', '蓝色': '🔵', '绿色': '🟢', '黄色': '🟡', '橙色': '🟠', '紫色': '🟣', '粉色': '💗', '棕色': '🟤', '黑色': '⚫', '白色': '⚪',
                '狗': '🐕', '猫': '🐱', '鸟': '🐦', '鱼': '🐟', '兔子': '🐰', '猴子': '🐵', '大象': '🐘', '熊猫': '🐼', '老虎': '🐯', '狮子': '🦁',
                '苹果': '🍎', '香蕉': '🍌', '橙子': '🍊', '面包': '🍞', '牛奶': '🥛', '水': '💧', '鸡蛋': '🥚', '米饭': '🍚', '蛋糕': '🍰', '果汁': '🧃',
                '学校': '🏫', '教室': '🏠', '书': '📖', '铅笔': '✏️', '钢笔': '🖊️', '尺子': '📏', '书包': '🎒', '老师': '👨‍🏫', '学生': '🎓',
                '头': '🗣️', 'face': '😊', '眼睛': '👀', '鼻子': '👃', '嘴巴': '👄', '耳朵': '👂', '手': '✋', '脚': '🦶',
                '星期一': '📅', '星期二': '📅', '星期三': '📅', '星期四': '📅', '星期五': '📅', '星期六': '📅', '星期日/天': '📅',
                '英语': '📚', '数学': '🔢', '语文': '📖', '音乐': '🎵', '美术': '🎨', '体育': '⚽',
                '阅读': '📖', '书写': '✍️', '画画': '🎨', '唱歌': '🎤', '跳舞': '💃', '游戏': '🎮'
            };
            return emojiMap[word] || '📝';
        }

        function normalizeAnswer(answer) {
            return answer.toLowerCase().trim();
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput');
            const userAnswer = normalizeAnswer(input.value);
            const q = currentQuestions[currentIndex];
            const correctAnswer = normalizeAnswer(q.answer);
            
            const isCorrect = userAnswer === correctAnswer;
            
            if (isCorrect) {
                score++;
                input.classList.add('correct');
                document.getElementById('feedback').className = 'feedback show correct';
                document.getElementById('feedback').textContent = '✅ 正确！';
            } else {
                input.classList.add('wrong');
                document.getElementById('feedback').className = 'feedback show wrong';
                document.getElementById('feedback').textContent = `❌ 正确答案是: ${q.answer}`;
            }
            
            userAnswers.push({
                question: q.question,
                selected: input.value,
                correct: q.answer,
                isCorrect: isCorrect
            });
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < currentQuestions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        }

        function skipAnswer() {
            const q = currentQuestions[currentIndex];
            userAnswers.push({
                question: q.question,
                selected: '(跳过)',
                correct: q.answer,
                isCorrect: false
            });
            
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');
            
            document.getElementById('scoreDisplay').textContent = `${score}/${currentQuestions.length}`;
            
            const percentage = (score / currentQuestions.length) * 100;
            let message = '';
            if (percentage === 100) message = '🎉 太棒了！满分！';
            else if (percentage >= 80) message = '🌟 非常优秀！';
            else if (percentage >= 60) message = '👍 做得不错！';
            else if (percentage >= 40) message = '📚 再加油！';
            else message = '💪 继续努力！';
            
            document.getElementById('scoreMessage').textContent = message;
            
            let detailsHTML = '';
            userAnswers.forEach((answer, index) => {
                const status = answer.isCorrect ? '✅' : (answer.selected === '(跳过)' ? '⏭️' : '❌');
                const yourAnswer = answer.selected === '(跳过)' ? '<span class="your-answer">(跳过)</span>' : 
                    answer.isCorrect ? answer.selected : `<span class="your-answer">${answer.selected}</span>`;
                detailsHTML += `
                    <div class="result-item">
                        <span>${index + 1}. ${answer.question}</span>
                        <span>${status}</span>
                    </div>
                    <div class="result-item">
                        <span>你的答案: ${yourAnswer}</span>
                        <span class="correct-answer">正确答案: ${answer.correct}</span>
                    </div>
                `;
            });
            document.getElementById('resultDetails').innerHTML = detailsHTML;
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('startScreen').classList.add('active');
        }

        // 回车提交
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
